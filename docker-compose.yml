services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  activemq:
    image: apache/activemq-classic:5.18.3
    ports:
      # Host ports avoid collision with a local ActiveMQ install on 61616/8161
      - "61617:61616"
      - "8162:8161"
    environment:
      ACTIVEMQ_ADMIN_LOGIN: admin
      ACTIVEMQ_ADMIN_PASSWORD: admin

  document-version-update-events-1:
    build: .
    ports:
      - "3030:3030"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 3030
      SPRING_APPLICATION_NAME: document-version-update-events-1
      APP_DOCKER_POSTGRES_HOST: postgres
      APP_DOCKER_POSTGRES_PORT: 5432
      APP_DOCKER_ACTIVEMQ_HOST: activemq
      APP_DOCKER_ACTIVEMQ_PORT: 61616
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_started
    restart: unless-stopped

  document-version-update-events-2:
    build: .
    ports:
      - "3031:3031"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 3031
      SPRING_APPLICATION_NAME: document-version-update-events-2
      APP_DOCKER_POSTGRES_HOST: postgres
      APP_DOCKER_POSTGRES_PORT: 5432
      APP_DOCKER_ACTIVEMQ_HOST: activemq
      APP_DOCKER_ACTIVEMQ_PORT: 61616
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
