spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=lexis-nexis-events
spring.jpa.properties.hibernate.default_schema=lexis-nexis-events

spring.flyway.enabled=true
spring.flyway.schemas=lexis-nexis-events
spring.flyway.default-schema=lexis-nexis-events
spring.flyway.create-schemas=true

spring.activemq.broker-url=vm://embedded?broker.persistent=false&jms.prefetchPolicy.queuePrefetch=1
spring.jms.pub-sub-domain=false
app.jms.listener.concurrency=1-2
app.jms.document-stripes=8
app.jms.revision-events-destination=document.revision.events

# Fast redelivery in tests (avoid multi-second waits if a test triggers rollback).
app.jms.redelivery.initial-delay-ms=100
app.jms.redelivery.use-exponential-backoff=false
app.demo.retry-verification.failures-before-success=1
