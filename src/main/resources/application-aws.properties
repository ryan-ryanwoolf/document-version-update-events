# AWS profile (spring.profiles.active=aws)
# ECS/Fargate: RDS PostgreSQL + existing SQS standard queue. Credentials via task/instance role.

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jms.activemq.ActiveMQAutoConfiguration

# RDS (set via ECS task environment or Secrets Manager -> env)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:lexis-nexis-events}${DB_JDBC_PARAMS:&sslmode=require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:lexis-nexis-events}
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:lexis-nexis-events}
spring.flyway.default-schema=${DB_SCHEMA:lexis-nexis-events}
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# AWS SDK (region + default credential chain on ECS task role)
spring.cloud.aws.region.static=${AWS_REGION}
spring.cloud.aws.credentials.use-default-credentials-chain=true

# SQS standard queue (URL from platform / Terraform)
app.sqs.revision-events-queue-url=${AWS_SQS_REVISION_EVENTS_QUEUE_URL}
app.jms.document-stripes=64

spring.cloud.aws.sqs.listener.max-messages-per-poll=10
spring.cloud.aws.sqs.listener.poll-timeout=20s

# Demo HTTP endpoints off by default in AWS; enable only for smoke tests.
app.demo.endpoints.enabled=${APP_DEMO_ENDPOINTS_ENABLED:false}
app.demo.retry-verification.enabled=${APP_DEMO_RETRY_VERIFICATION_ENABLED:false}

pending-revisions.reconcile-delay-ms=60000
pending-revisions.reconcile-batch-size=100
pending-revisions.executor.core-pool-size=4
pending-revisions.executor.max-pool-size=4
pending-revisions.executor.queue-capacity=100

app.search.max-query-length=200
app.search.default-limit=20
app.search.max-limit=100

# ECS / ALB health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
