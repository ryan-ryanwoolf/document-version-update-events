# Docker profile (spring.profiles.active=docker)
# Used by docker-compose and when running the app on the host against compose infrastructure.
# Loads after application.properties; settings here override defaults.

spring.application.name=document-version-update-events

# Host/port targets for compose (override in docker-compose for in-network service names)
app.docker.postgres.host=localhost
app.docker.postgres.port=5433
app.docker.activemq.host=localhost
app.docker.activemq.port=61617

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${app.docker.postgres.host}:${app.docker.postgres.port}/postgres?currentSchema=lexis-nexis-events
spring.datasource.username=postgres
spring.datasource.password=${DOCKER_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=lexis-nexis-events
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

spring.flyway.enabled=true
spring.flyway.schemas=lexis-nexis-events
spring.flyway.default-schema=lexis-nexis-events
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# ActiveMQ
spring.activemq.broker-url=tcp://${app.docker.activemq.host}:${app.docker.activemq.port}?jms.prefetchPolicy.queuePrefetch=1
spring.activemq.user=admin
spring.activemq.password=${DOCKER_ACTIVEMQ_PASSWORD}
spring.activemq.packages.trust-all=true
spring.jms.pub-sub-domain=false

app.jms.revision-events-destination=document.revision.events
app.jms.listener.concurrency=3-8
app.jms.document-stripes=64

app.jms.redelivery.initial-delay-ms=5000
app.jms.redelivery.use-exponential-backoff=true
app.jms.redelivery.backoff-multiplier=2.0
app.jms.redelivery.maximum-redelivery-delay-ms=120000

app.demo.endpoints.enabled=true
app.demo.retry-verification.enabled=true

# Backstop sweep for pending rows (see default application.properties).
pending-revisions.reconcile-delay-ms=60000
pending-revisions.reconcile-batch-size=100
pending-revisions.executor.core-pool-size=4
pending-revisions.executor.max-pool-size=4
pending-revisions.executor.queue-capacity=100

app.search.max-query-length=200
app.search.default-limit=20
app.search.max-limit=100
