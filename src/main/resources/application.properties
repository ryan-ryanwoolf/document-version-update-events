spring.application.name=document-version-update-events
server.port=@server.port@

# PostgreSQL (local development — override DB_PASSWORD for non-default credentials)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=lexis-nexis-events
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=lexis-nexis-events
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

spring.flyway.enabled=true
spring.flyway.schemas=lexis-nexis-events
spring.flyway.default-schema=lexis-nexis-events
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# ActiveMQ (local development defaults)
spring.activemq.broker-url=tcp://localhost:61616?jms.prefetchPolicy.queuePrefetch=1
spring.activemq.user=admin
spring.activemq.password=${ACTIVEMQ_PASSWORD}
spring.activemq.packages.trust-all=true
spring.jms.pub-sub-domain=false

app.jms.revision-events-destination=document.revision.events
app.jms.listener.concurrency=3-8
app.jms.document-stripes=64

# ActiveMQ client RedeliveryPolicy: delay before the first broker redelivery after a transacted listener rolls back.
# The out-of-the-box default is ~1000 ms, which can look like an immediate in-thread retry. SQS analogue: visibility timeout.
app.jms.redelivery.initial-delay-ms=5000
app.jms.redelivery.use-exponential-backoff=true
app.jms.redelivery.backoff-multiplier=2.0
app.jms.redelivery.maximum-redelivery-delay-ms=120000

# Demo HTTP (local/docker); disabled on aws profile unless APP_DEMO_ENDPOINTS_ENABLED=true
app.demo.endpoints.enabled=true

# Demo: POST /demo/revision-events/retry-verification — first N listener deliveries throw (broker redelivery + backoff), then one applies.
app.demo.retry-verification.enabled=true
app.demo.retry-verification.failures-before-success=3

# ShedLock sweep for pending rows (fixed delay after prior run). Inline drain on apply keeps latency low; this is a backstop.
pending-revisions.reconcile-delay-ms=60000
pending-revisions.reconcile-batch-size=100
pending-revisions.executor.core-pool-size=4
pending-revisions.executor.max-pool-size=4
pending-revisions.executor.queue-capacity=100

app.search.max-query-length=200
app.search.default-limit=20
app.search.max-limit=100
